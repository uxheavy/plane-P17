# Development override for docker-compose-local.yml.
#
# Usage (through the repository lifecycle, which resolves .env.schema and
# supplies the allocated host ports):
#   python3 -m development up
#
# Or directly:
#   varlock run -- docker compose -p company-runner-development \
#     -f docker-compose-local.yml -f docker-compose-development.yml up
#
# Environment values come from varlock, not from an env_file. Each service
# clears the base definition's `env_file` so that the resolved schema is the
# only source. Running `docker compose` without varlock therefore leaves these
# services without configuration rather than silently using stale files.
#
# Contains no secret. The development SECRET_KEY is a placeholder.
services:
  plane-db:
    env_file: !override []
  plane-mq:
    env_file: !override []
  plane-minio:
    image: quay.io/minio/minio:latest
    env_file: !override []
    entrypoint:
      - minio
    command:
      - server
      - /export
      - --console-address
      - :9090
  api:
    env_file: !override []
    environment:
      DEBUG: "1"
      WEB_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      USE_MINIO: "1"
  worker:
    env_file: !override []
    environment:
      DEBUG: "1"
      WEB_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      USE_MINIO: "1"
  migrator:
    env_file: !override []
    environment:
      DEBUG: "1"
  beat-worker:
    env_file: !override []
    environment:
      DEBUG: "1"
  # The web client. Development runs the Vite dev server so the UI reflects
  # source edits without a rebuild. Its configuration is resolved from
  # apps/web/.env.schema, the same way every other service is configured;
  # DEV_BACKEND_URL there names the `api` service on the Compose network, which
  # is what vite.config.ts proxies to.
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    env_file: !override
      - ./apps/web/.env
    volumes:
      - ./apps/web:/app/apps/web
      - web_node_modules:/app/apps/web/node_modules
    depends_on:
      - api
    ports:
      - "127.0.0.1:${DEV_WEB_PORT}:3000"

volumes:
  web_node_modules:
